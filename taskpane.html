<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typo Check</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root {
  --bg: #ffffff; --fg: #1f1f1f; --muted: #5f6368; --line: #e3e6e4; --soft: #f5f7f5;
  --accent: #15803d; --accent-ink: #ffffff; --accent-soft: #e6f4ea; --accent-line: #b7dfc3;
  --spell: #d93025; --grammar: #c26100; --banned: #8e24aa; --style: #1a73e8; --sel: #fff8d6;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #1f1f1f; --fg: #ececec; --muted: #a8aeaa; --line: #3a3d3b; --soft: #2a2c2b;
  --accent: #3fb36a; --accent-ink: #0b1a10; --accent-soft: #1f3526; --accent-line: #2f5a3b;
  --spell: #ff7a6e; --grammar: #f0a040; --banned: #ce8ae0; --style: #7fb2ff; --sel: #3a3420; color-scheme: dark } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; display: flex; flex-direction: column; }
button { font: inherit; }
.top { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.count { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.count small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 4px; }
.grow { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--bg); color: var(--muted); padding: 4px 9px; cursor: pointer; font-size: 12px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 14px; padding: 2px 9px; font-size: 12px; cursor: pointer; background: var(--bg); color: var(--fg); font-variant-numeric: tabular-nums; }
.chip.off { opacity: .45; text-decoration: line-through; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.status { font-size: 12px; color: var(--muted); min-height: 1.2em; }
.list { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.card { border: 1px solid var(--line); border-left: 3px solid var(--muted); border-radius: 8px; padding: 8px 10px; background: var(--bg); }
.card.active { background: var(--sel); }
.msg { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 3px; }
.msg .para { color: var(--muted); font-weight: 500; text-transform: none; letter-spacing: 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ctx { cursor: pointer; word-break: break-word; color: var(--fg); opacity: .85; }
.ctx b { opacity: 1; font-weight: 700; text-decoration: underline wavy; text-underline-offset: 3px; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; align-items: center; }
.fix { background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent); border-radius: 6px; padding: 3px 9px; font-weight: 650; cursor: pointer; }
.lnk { background: transparent; border: 0; color: var(--muted); font-size: 12px; cursor: pointer; padding: 3px 4px; text-decoration: underline; }
.lnk:hover { color: var(--fg); }
.empty { text-align: center; color: var(--muted); padding: 28px 8px; }
.empty .ok { font-size: 28px; color: var(--accent); }
details { border-top: 1px solid var(--line); padding: 8px 14px 12px; }
summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
label { display: block; font-weight: 600; font-size: 12px; margin: 8px 0 4px; }
textarea { width: 100%; min-height: 110px; resize: vertical; font: 12px/1.45 Consolas, ui-monospace, monospace; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.err { color: var(--spell); padding: 14px; }
button:focus-visible, summary:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="top">
  <div class="row">
    <div class="count" id="count">…<small>loading</small></div>
    <span class="grow"></span>
    <span class="seg" title="Spelling standard"><button id="uk" type="button">UK</button><button id="us" type="button">US</button></span>
    <button class="btn primary" id="recheck" type="button">Recheck</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="status" id="status" role="status"></div>
</div>
<div class="list" id="list"></div>
<details id="lists">
  <summary>Word lists</summary>
  <label for="words">Words to accept (one per line)</label>
  <textarea id="words" spellcheck="false"></textarea>
  <label for="banned">Banned words (one per line, variants split by /)</label>
  <textarea id="banned" spellcheck="false"></textarea>
  <div class="row" style="margin-top:8px"><button class="btn" id="save" type="button">Save lists</button><button class="lnk" id="reset" type="button">Restore defaults</button></div>
  <div class="hint">Saved in this browser. They apply to every document you check here.</div>
</details>

        acts.appendChild(el("button", { class: "fix", type: "button", title: "Replace in document", text: lbl, onclick: function () { apply(it, f); } }));
      });
      if (it.cat === "spell" && !fixes.length) acts.appendChild(el("span", { class: "hint", text: "No suggestions" }));
      acts.appendChild(el("button", { class: "lnk", type: "button", text: "Ignore", onclick: function () { state.ignore.add(it.key); check(true); } }));
      if (it.cat === "spell" && it.word) acts.appendChild(el("button", { class: "lnk", type: "button", text: "Add to dictionary", onclick: function () {
        var w = it.word.replace(/’/g, "'").toLowerCase();
        if (state.wordsList.indexOf(w) < 0) { state.wordsList.push(w); LS.set("words", state.wordsList); $("words").value = state.wordsList.join("\n"); }
        words = wordSet(); check(true);
      } }));
      list.appendChild(el("div", { class: "card", "data-id": it.id, style: { "border-left-color": COLORS[it.cat] } }, [
        el("div", { class: "msg", style: { color: COLORS[it.cat] } }, [el("span", { text: it.msg }), el("span", { class: "para", text: "Para " + (it.pi + 1) })]),
        ctxNode, acts
      ]));
    });
    if (vis.length > 300) list.appendChild(el("div", { class: "hint", text: "Showing the first 300 issues." }));
    markActive();
  }

  // ---------- controls ----------
  function setUS(v) { state.us = v; LS.set("us", v); $("us").className = v ? "on" : ""; $("uk").className = v ? "" : "on"; check(true); }
  $("uk").addEventListener("click", function () { setUS(false); });
  $("us").addEventListener("click", function () { setUS(true); });
  $("us").className = state.us ? "on" : ""; $("uk").className = state.us ? "" : "on";
  $("recheck").addEventListener("click", function () { status("Checking…"); check(true); });
  $("words").value = state.wordsList.join("\n");
  $("banned").value = state.banned.join("\n");
  function lines(id) { return $(id).value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean); }
  $("save").addEventListener("click", function () {
    state.wordsList = lines("words"); state.banned = lines("banned");
    LS.set("words", state.wordsList); LS.set("banned", state.banned);
    words = wordSet(); status("Lists saved."); check(true);
  });
  $("reset").addEventListener("click", function () {
    $("words").value = DEFAULT_WORDS.join("\n"); $("banned").value = DEFAULT_BANNED.join("\n");
    status("Defaults restored. Press Save lists to use them.");
  });

  // ---------- start ----------
  function loadDict() {
    var bin = atob(DICT), u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"))).text().then(function (t) { engine = makeEngine(t); });
  }
  Office.onReady(function (info) {
    if (info.host !== Office.HostType.Word) {
      $("list").appendChild(el("div", { class: "err", text: "Typo Check runs inside Microsoft Word. Open a Word document and start it from the Home tab." }));
      $("count").textContent = "–";
      return;
    }
    loadDict().then(function () {
      return check(true);
    }).then(function () {
      try {
        Office.context.document.addHandlerAsync(Office.EventType.DocumentSelectionChanged, function () { schedule(1200); });
      } catch (e) {}
      setInterval(function () { if (!document.hidden) check(false); }, 8000);
    }).catch(function (e) {
      $("count").textContent = "–";
      status("Couldn't start: " + (e && e.message ? e.message : e));
    });
  });
})();
</script>
</body>
</html>
